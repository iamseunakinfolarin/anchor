<script>
  // Simple micro-interactions for player delight
  const playBtn = document.getElementById('play-pause-btn');
  const playIcon = document.getElementById('play-icon');
  let isPlaying = true;

  playBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
    if (!isPlaying) {
      playBtn.classList.remove('shadow-[0_12px_28px_rgba(183,19,26,0.38)]');
      playBtn.classList.add('shadow-md');
    } else {
      playBtn.classList.add('shadow-[0_12px_28px_rgba(183,19,26,0.38)]');
      playBtn.classList.remove('shadow-md');
    }
  });

  const likeBtn = document.getElementById('like-btn');
  const likeIcon = document.getElementById('like-icon');
  let isLiked = false;

  likeBtn.addEventListener('click', () => {
    isLiked = !isLiked;
    if (isLiked) {
      likeIcon.textContent = 'favorite';
      likeIcon.classList.add('text-primary');
      likeIcon.style.fontVariationSettings = "'FILL' 1";
    } else {
      likeIcon.textContent = 'favorite_border';
      likeIcon.classList.remove('text-primary');
      likeIcon.style.fontVariationSettings = "'FILL' 0";
    }
  });

  // Toggle Repeat and Shuffle active highlights
  const repeatBtn = document.getElementById('repeat-btn');
  const shuffleBtn = document.getElementById('shuffle-btn');

  repeatBtn.addEventListener('click', () => {
    repeatBtn.classList.toggle('text-primary');
  });

  shuffleBtn.addEventListener('click', () => {
    shuffleBtn.classList.toggle('text-primary');
  });

  // Interactive volume slider simulation
  const volTrack = document.getElementById('volume-track');
  const volFill = document.getElementById('volume-fill');
  const volKnob = document.getElementById('volume-knob');
  const volText = document.getElementById('volume-text');

  volTrack.addEventListener('click', (e) => {
    const rect = volTrack.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const percent = Math.round(pos * 100);
    volFill.style.width = percent + '%';
    volKnob.style.left = percent + '%';
    volText.textContent = percent + '%';
  });
